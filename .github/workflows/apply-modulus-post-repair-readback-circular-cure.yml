name: Apply MODULUS post-repair readback circular-head cure

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'governance/gcl-ghos-modulus-post-repair-readback-collector-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/gcl-ghos-modulus-post-repair-readback-collector-001
          fetch-depth: 0

      - name: Verify and apply closed cure
        shell: bash
        run: |
          set -euo pipefail
          payload='governance/settings-readback/.GCL-GHOS-MODULUS-POST-REPAIR-READBACK-CIRCULAR-CURE.payload.tgz.b64'
          archive="$RUNNER_TEMP/circular-cure.tgz"
          base64 --decode "$payload" > "$archive"
          test "$(tar -tzf "$archive" | wc -l)" -eq 4
          tar -xzf "$archive"
          echo '182b33310c09ee7951e80df368d8666be8129b6c4d57ec0ced1b3af0e0cb5592  scripts/gcl_ghos_modulus_post_repair_readback.py' | sha256sum --check --strict
          echo '186c53172c835e688fddeb4fdfb56364d15dff7504beefa69b00404066ce010f  governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.schema.json' | sha256sum --check --strict
          echo '417a5ef76ea49dcfb56a3ce25db9aff43354093590ea376f1c483fc55ab46b3a  modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py' | sha256sum --check --strict
          echo '91bad18bbbb293198223adaa176fac90e97c7017b54006600a86cae9d25bb21a  governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-COLLECTOR-001.attestation.md' | sha256sum --check --strict
          python -m py_compile scripts/gcl_ghos_modulus_post_repair_readback.py modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py
          python -m json.tool governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.schema.json >/dev/null

      - name: Remove staging inputs and commit corrected package
        shell: bash
        run: |
          set -euo pipefail
          rm governance/settings-readback/.GCL-GHOS-MODULUS-POST-REPAIR-READBACK-CIRCULAR-CURE.payload.tgz.b64
          rm .github/workflows/apply-modulus-post-repair-readback-circular-cure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cure post-repair readback target-head binding'
          git push origin HEAD:governance/gcl-ghos-modulus-post-repair-readback-collector-001
