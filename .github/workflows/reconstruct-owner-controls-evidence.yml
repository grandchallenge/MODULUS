name: Reconstruct owner-controls evidence

on:
  push:
    branches:
      - governance/gcl-ghos-modulus-owner-controls-evidence-001

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/gcl-ghos-modulus-owner-controls-evidence-001
          fetch-depth: 0

      - name: Reconstruct and verify permanent evidence
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          staging = Path(
              'governance/settings-readback/.staging/'
              'GCL-GHOS-MODULUS-OWNER-CONTROLS-001.tar.gz.b64'
          )
          compressed = base64.b64decode(staging.read_text(encoding='utf-8'), validate=True)
          expected_archive = 'b9b2d9099f3b27d02a1fec8f344b1dcace7932fdfd835d763664d920bf30e85f'
          assert hashlib.sha256(compressed).hexdigest() == expected_archive
          archive = gzip.decompress(compressed)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as handle:
              members = handle.getmembers()
              expected = {
                  'governance/settings-readback/evidence/GCL-GHOS-MODULUS-OWNER-CONTROLS-001.receipt.json',
                  'governance/settings-readback/evidence/GCL-GHOS-MODULUS-OWNER-CONTROLS-001.receipt.json.sha256',
                  'governance/settings-readback/GCL-GHOS-MODULUS-OWNER-CONTROLS-001.receipt.schema.json',
                  'modulus/tests/test_gcl_ghos_modulus_owner_controls_receipt.py',
              }
              observed = {member.name for member in members}
              assert observed == expected
              for member in members:
                  target = Path(member.name)
                  assert not target.is_absolute()
                  assert '..' not in target.parts
              handle.extractall('.')

          receipt = Path(
              'governance/settings-readback/evidence/'
              'GCL-GHOS-MODULUS-OWNER-CONTROLS-001.receipt.json'
          )
          digest = hashlib.sha256(receipt.read_bytes()).hexdigest()
          assert digest == 'bb08be8289fadc455ee413ec59c12a76f22d5cf1021669708c9a88be86f782ba'
          companion = receipt.with_suffix(receipt.suffix + '.sha256')
          assert companion.read_text(encoding='utf-8') == (
              f'{digest}  {receipt.name}\n'
          )
          PY

      - name: Remove staging inputs and commit exact evidence
        shell: bash
        run: |
          rm -f governance/settings-readback/.staging/GCL-GHOS-MODULUS-OWNER-CONTROLS-001.tar.gz.b64
          rmdir governance/settings-readback/.staging 2>/dev/null || true
          rm -f .github/workflows/reconstruct-owner-controls-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Admit reconstructed MODULUS owner-controls evidence'
          git push origin HEAD:governance/gcl-ghos-modulus-owner-controls-evidence-001
