name: Reconstruct MODULUS post-repair readback collector

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconstruct:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'governance/gcl-ghos-modulus-post-repair-readback-collector-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/gcl-ghos-modulus-post-repair-readback-collector-001
          fetch-depth: 0

      - name: Verify and reconstruct closed collector package
        shell: bash
        run: |
          set -euo pipefail
          payload='governance/settings-readback/.GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.payload.tgz.b64'
          archive="$RUNNER_TEMP/readback.tgz"
          base64 --decode "$payload" > "$archive"
          echo 'a25615bc1c4766f7141e6c394f7e8447ca6c6216c6cf91f459a0f4514dd3e932  '"$archive" | sha256sum --check --strict
          tar -tzf "$archive" | grep -Fx 'scripts/gcl_ghos_modulus_post_repair_readback.py'
          tar -tzf "$archive" | grep -Fx 'governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.schema.json'
          tar -tzf "$archive" | grep -Fx 'modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py'
          test "$(tar -tzf "$archive" | wc -l)" -eq 3
          tar -xzf "$archive"
          echo 'c3123ef6f10dc6e7a7964cd313310124834be4cd262dc6b8c61509f0d6e26d0b  scripts/gcl_ghos_modulus_post_repair_readback.py' | sha256sum --check --strict
          echo 'b41cee681bdde18c020f915bc9eadb0874c82eed0ae68ba1241f8dbc019ca3e0  governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.schema.json' | sha256sum --check --strict
          echo '70321df8ae7a0cb0c2a5fdf2ffc8989aa9d4533902d1fdb614f29f5244e5417c  modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py' | sha256sum --check --strict
          python -m py_compile scripts/gcl_ghos_modulus_post_repair_readback.py modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py
          python -m json.tool governance/settings-readback/GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.schema.json >/dev/null

      - name: Remove staging inputs and commit permanent package
        shell: bash
        run: |
          set -euo pipefail
          rm governance/settings-readback/.GCL-GHOS-MODULUS-POST-REPAIR-READBACK-001.payload.tgz.b64
          rm .github/workflows/reconstruct-modulus-post-repair-readback-collector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add closed MODULUS post-repair readback collector'
          git push origin HEAD:governance/gcl-ghos-modulus-post-repair-readback-collector-001
