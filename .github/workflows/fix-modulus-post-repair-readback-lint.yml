name: Fix MODULUS post-repair readback lint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'governance/gcl-ghos-modulus-post-repair-readback-collector-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/gcl-ghos-modulus-post-repair-readback-collector-001
          fetch-depth: 0

      - name: Remove unused import and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^import base64$' modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py)" -eq 1
          sed -i '/^import base64$/d' modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py
          echo '6f22666f765d54d27a17c44a6a714966fca02f94fbc4cfa997e05c986395c9be  modulus/tests/test_gcl_ghos_modulus_post_repair_readback.py' | sha256sum --check --strict
          rm .github/workflows/fix-modulus-post-repair-readback-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove unused readback test import'
          git push origin HEAD:governance/gcl-ghos-modulus-post-repair-readback-collector-001
